<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title description">
  <title id="title">Alpamayo-R1 trajectory audit pipeline</title>
  <desc id="description">Camera, ego-motion, and LiDAR data feed Alpamayo-R1 and a trained occupancy forecaster. The project compares reasoning with trajectories and compares candidate vehicle footprints with predicted occupancy. It writes candidate, prediction, selection, and benchmark artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .step { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #64748b; }
      .heading { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .chip { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .output { font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="650" rx="24" fill="#f8fafc"/>
  <text x="48" y="62" class="title">From a recorded scene to an auditable trajectory</text>
  <text x="48" y="98" class="subtitle">The project connects model reasoning, candidate motion, and predicted road occupancy.</text>

  <text x="48" y="145" class="step">1 · RECORDED INPUTS</text>
  <g filter="url(#shadow)">
    <rect x="48" y="166" width="250" height="322" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="74" y="198" width="198" height="64" rx="12" fill="#e0f2fe"/>
  <text x="96" y="237" class="chip">Camera frames</text>
  <rect x="74" y="280" width="198" height="64" rx="12" fill="#e0f2fe"/>
  <text x="96" y="319" class="chip">Ego-motion history</text>
  <rect x="74" y="362" width="198" height="92" rx="12" fill="#dcfce7"/>
  <text x="96" y="401" class="chip">Past LiDAR</text>
  <text x="96" y="428" class="small">3 map snapshots</text>

  <text x="358" y="145" class="step">2 · MODEL OUTPUTS</text>
  <g filter="url(#shadow)">
    <rect x="358" y="166" width="352" height="142" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="358" y="332" width="352" height="156" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="358" y="166" width="10" height="142" rx="5" fill="#0ea5e9"/>
  <text x="392" y="209" class="heading">Alpamayo-R1-10B</text>
  <text x="392" y="241" class="body">Reasoning text</text>
  <text x="392" y="271" class="body">Six candidate trajectories</text>
  <text x="392" y="295" class="small">Existing NVIDIA model</text>

  <rect x="358" y="332" width="10" height="156" rx="5" fill="#22c55e"/>
  <text x="392" y="375" class="heading">Occupancy forecaster</text>
  <text x="392" y="407" class="body">Six future occupancy maps</text>
  <text x="392" y="437" class="body">0.5 to 6 seconds</text>
  <text x="392" y="469" class="small">339,910 parameters · trained here</text>

  <path d="M298 237 H346" class="arrow"/>
  <path d="M298 312 C326 312 326 237 346 237" class="arrow"/>
  <path d="M298 408 H346" class="arrow"/>

  <text x="770" y="145" class="step">3 · AUDITS</text>
  <g filter="url(#shadow)">
    <rect x="770" y="166" width="310" height="142" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="770" y="332" width="310" height="156" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="770" y="166" width="10" height="142" rx="5" fill="#8b5cf6"/>
  <text x="804" y="209" class="heading">Reasoning ↔ action</text>
  <text x="804" y="244" class="body">Does the text intent match</text>
  <text x="804" y="273" class="body">the trajectory motion?</text>

  <rect x="770" y="332" width="10" height="156" rx="5" fill="#f59e0b"/>
  <text x="804" y="375" class="heading">Trajectory ↔ occupancy</text>
  <text x="804" y="410" class="body">Where does each vehicle</text>
  <text x="804" y="439" class="body">footprint meet occupancy?</text>
  <text x="804" y="470" class="small">Recorded future data scores the result</text>

  <path d="M710 237 H758" class="arrow"/>
  <path d="M710 410 H758" class="arrow"/>
  <path d="M710 260 C740 260 740 375 758 375" class="arrow"/>

  <text x="1140" y="145" class="step">4 · REPRODUCIBLE OUTPUTS</text>
  <g filter="url(#shadow)">
    <rect x="1140" y="166" width="252" height="322" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="1172" y="213" class="heading">Artifacts</text>
  <rect x="1172" y="238" width="188" height="47" rx="10" fill="#f1f5f9"/>
  <text x="1190" y="268" class="output">candidates.npz</text>
  <rect x="1172" y="298" width="188" height="47" rx="10" fill="#f1f5f9"/>
  <text x="1190" y="328" class="output">predictions.npz</text>
  <rect x="1172" y="358" width="188" height="47" rx="10" fill="#f1f5f9"/>
  <text x="1190" y="388" class="output">selections.jsonl</text>
  <rect x="1172" y="418" width="188" height="47" rx="10" fill="#f1f5f9"/>
  <text x="1190" y="448" class="output">benchmark.json</text>
  <path d="M1080 319 H1128" class="arrow"/>

  <rect x="48" y="536" width="1344" height="72" rx="16" fill="#e2e8f0"/>
  <text x="76" y="568" class="body">2,000 clips · 12,000 candidate trajectories · source-chunk split · artifact hashes · SLURM execution</text>
  <text x="76" y="595" class="small">Future LiDAR supplies training labels for training clips and independent evaluation for held-out clips.</text>
</svg>
